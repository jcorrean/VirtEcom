# _quarto.yml
# -------------------------------------------------
# Default profile: WEBSITE
# -------------------------------------------------
project:
  type: website

render:
  - Results.qmd       # what gets built for the site

website:
  title: ""                           # empty banner title
  sidebar:
    left:
      - href: Results.qmd
        text: Home

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    number-sections: true

lang: en
bibliography: refs.bib

# Optional site-level author (used ONLY by the website unless a page overrides it)
author:
  - name: Juan C. Correa
    orcid: 0000-0002-0301-5641
    corresponding: true
    affiliation:
      name: Department of Business Studies, Universidad Iberoamericana, Mexico City
    url: https://perfiles.ibero.mx/en/persons/juan-carlos-correa/
    email: j.correa@gmail.com

title: "From Knowledge to innovation"
subtitle: "***Supplementary Material***"
date: "17 November 2026"

# -------------------------------------------------
# MANUSCRIPT profile (switch with: -P manuscript)
# -------------------------------------------------
profiles:
  manuscript:
    project:
      type: manuscript              # prevents website wiring from interfering
    
    # Clear global fields so the document-level YAML wins
    metadata:
      title: null
      subtitle: null
      date: null
      author: []                    # <— important: clears project authors
      
    # Manuscript-specific global defaults (safe)
    format:
      docx:
        toc: false
        number-sections: true